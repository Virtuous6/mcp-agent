$schema: ../schema/mcp-agent.config.schema.json

execution_engine: asyncio
logger:
  transports: [console] # Only console logging - Supabase logging handled separately
  level: info
  show_progress: true
  # Disabled file logging since we use Supabase logging instead
  # path: "logs/meta-agent.jsonl"
  # path_settings:
  #   path_pattern: "logs/meta-agent-{unique_id}.jsonl"
  #   unique_id: "timestamp"
  #   timestamp_format: "%Y%m%d_%H%M%S"

mcp:
  servers:
    # Note: Slack integration is handled directly via Socket Mode in main.py
    # No MCP server needed since we have direct Slack WebSocket connection

    # Supabase for data persistence, memory, and workflows
    supabase:
      command: "npx"
      args: ["-y", "@supabase/mcp-server-supabase@latest"]
      description: "Access Supabase API operations"

    # Essential utility servers
    filesystem:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

    fetch:
      command: "uvx"
      args: ["mcp-server-fetch"]

    # GitHub for code deployment and management (commented out - add your GitHub token to enable)
    # github:
    #   command: "docker"
    #   args:
    #     [
    #       "run",
    #       "-i",
    #       "--rm",
    #       "-e",
    #       "GITHUB_PERSONAL_ACCESS_TOKEN",
    #       "ghcr.io/github/github-mcp-server",
    #     ]

    # Browser automation for complex workflows
    brave_search:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-brave-search"]

    # n8n automation and workflow server via MCP endpoint
    n8n:
      transport: "sse"
      url: "https://advertisingreportcard.app.n8n.cloud/mcp/gmail-enhanced/sse"
      description: "n8n workflow automation with Airtable integration"

openai:
  default_model: gpt-4o

human_input:
  enabled: true
